# =============================================================================
# Pre-commit hooks configuration
# =============================================================================
# Install: pre-commit install
# Run all: pre-commit run --all-files
# Update:  pre-commit autoupdate
# =============================================================================

default_language_version:
  python: python3.12

default_stages: [pre-commit]

repos:
  # ===========================================================================
  # General hooks
  # ===========================================================================
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
      # Filesystem checks
  - id: check-added-large-files
    args: [--maxkb=1000]
    exclude: \.pt$|\.pth$|\.onnx$
  - id: check-case-conflict
  - id: check-symlinks
  - id: destroyed-symlinks

      # File content checks
  - id: check-merge-conflict
  - id: check-yaml
    args: [--unsafe]
  - id: check-toml
  - id: check-json
    exclude: \.ipynb$
  - id: check-xml

      # Python checks
  - id: check-ast
  - id: check-docstring-first
  - id: debug-statements
  - id: fix-byte-order-marker

      # Whitespace and line endings
  - id: trailing-whitespace
    args: [--markdown-linebreak-ext=md]
  - id: end-of-file-fixer
    exclude: \.ipynb$
  - id: mixed-line-ending
    args: [--fix=lf]

      # Security
  - id: detect-private-key

  # ===========================================================================
  # Python code formatting - Black
  # ===========================================================================
- repo: https://github.com/psf/black
  rev: 24.10.0
  hooks:
  - id: black
    language_version: python3.12
    args:
    - --line-length=100
    - --target-version=py310
    - --target-version=py311
    - --target-version=py312

  # ===========================================================================
  # Import sorting - isort
  # ===========================================================================
- repo: https://github.com/pycqa/isort
  rev: 5.13.2
  hooks:
  - id: isort
    args:
    - --profile=black
    - --line-length=100

#   # ===========================================================================
#   # Linting - Ruff (fast Python linter)
#   # ===========================================================================
# - repo: https://github.com/astral-sh/ruff-pre-commit
#   rev: v0.8.4
#   hooks:
#       # Linter
#   - id: ruff
#     args:
#     - --fix
#     - --exit-non-zero-on-fix
#     types_or: [python, pyi]

      # Formatter (alternative to black, can be disabled if using black)
      # - id: ruff-format


  # ===========================================================================
  # Security checks - Bandit
  # ===========================================================================
# - repo: https://github.com/PyCQA/bandit
#   rev: 1.8.0
#   hooks:
#   - id: bandit
#     args:
#     - -ll        # Only report medium and high severity
#     - --skip=B101,B311        # Skip assert and random warnings
#     exclude: ^tests/

  # ===========================================================================
  # Docstring checks - pydocstyle
  # ===========================================================================
- repo: https://github.com/pycqa/pydocstyle
  rev: 6.3.0
  hooks:
  - id: pydocstyle
    args:
    - --convention=google
    - --add-ignore=D100,D102,D104,D105,D107,D203,D212,D213
    exclude: ^(tests/|scripts/|debug_)
    additional_dependencies:
    - tomli

  # ===========================================================================
  # YAML formatting
  # ===========================================================================
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.14.0
  hooks:
  - id: pretty-format-yaml
    args:
    - --autofix
    - --indent=2
    exclude: ^(\.github/|mkdocs\.yml)

  # ===========================================================================
  # Markdown linting
  # ===========================================================================
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.43.0
  hooks:
  - id: markdownlint
    args:
    - --fix
    - --disable=MD013        # Line length
    - --disable=MD033        # Inline HTML
    - --disable=MD041        # First line heading
    - --disable=MD024
    - --disable=MD036
    - --disable=MD029

  # ===========================================================================
  # Commit message linting
  # ===========================================================================
# - repo: https://github.com/commitizen-tools/commitizen
#   rev: v4.1.0
#   hooks:
#   - id: commitizen
#     stages: [commit-msg]

  # ===========================================================================
  # Jupyter notebook checks
  # ===========================================================================
- repo: https://github.com/kynan/nbstripout
  rev: 0.8.1
  hooks:
  - id: nbstripout
    args:
    - --extra-keys=metadata.kernelspec metadata.language_info

  # ===========================================================================
  # Local hooks
  # ===========================================================================
- repo: local
  hooks:
      # Pytest check (optional - can be slow)
  - id: pytest-check
    name: pytest-check
    entry: python -m pytest tests/ -x -q --tb=no
    language: system
    pass_filenames: false
    always_run: false
    stages: [manual]      # Only run manually with: pre-commit run pytest-check

      # Check for TODO/FIXME comments
  - id: check-todos
    name: check-todos
    entry: bash -c 'git diff --cached --name-only | xargs grep -l "TODO" || true'
    language: system
    pass_filenames: false
    verbose: true
    stages: [manual]

# =============================================================================
# CI configuration
# =============================================================================
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: develop
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: [pytest-check, mypy]  # Skip slow hooks in CI
  submodules: false
