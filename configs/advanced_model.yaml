# BeautyScorer Advanced Model Configuration
# State-of-the-art ViT + ArcFace architecture for best accuracy

model:
  architecture: vit_arcface
  backbone: dinov2_vits14  # DINOv2 small for photos
  embed_dim: 768  # ViT-S embedding dimension
  num_encoder_layers: 6
  num_heads: 12
  ff_dim: 3072
  dropout: 0.1
  num_classes: 9
  unfreeze_backbone_layers: 4  # Fine-tune last layers
  use_positional_encoding: true  # ViT uses positional encoding
  use_cross_attention: true
  use_se_attention: true
  use_gradient_checkpointing: true  # Enable for large model
  pretrained: true

training:
  batch_size: 16  # Smaller batch due to larger model
  learning_rate: 0.00005  # Lower LR for fine-tuning
  backbone_lr_multiplier: 0.01  # Very small LR for pretrained backbone
  weight_decay: 0.05
  epochs: 100
  patience: 10
  label_smoothing: 0.1
  use_amp: true
  gradient_accumulation_steps: 2  # Effective batch size 32
  max_grad_norm: 1.0
  loss_function: focal  # Focal loss for class imbalance
  focal_gamma: 2.0
  scheduler: cosine
  scheduler_warmup_epochs: 5
  val_split: 0.15
  seed: 42
  num_workers: 8
  pin_memory: true

data:
  image_size: [384, 384]  # Higher resolution for ViT
  face_size: [224, 224]
  max_photos: 9
  augmentation: true
  augmentation_strength: heavy  # Strong augmentation for regularization
  face_detector: retinaface  # Most accurate face detector
  face_expand_percentage: 40
  face_confidence_threshold: 0.5
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]

paths:
  dataset_file: datasets/beauty_dataset.csv
  dataset_base_path: datasets/images
  output_dir: outputs/advanced
  checkpoint_path:
  export_dir: exports

logging:
  log_level: INFO
  log_dir: logs/advanced
  use_tensorboard: true
  use_wandb: true
  wandb_project: beauty-scorer-advanced
  wandb_entity:
  log_every_n_steps: 5
  save_every_n_epochs: 1
