[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beauty-scorer"
version = "1.0.0"
description = "Deep learning model for predicting beauty scores from photos using transformer-based multi-image aggregation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Alessio Savi"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
keywords = ["deep-learning", "computer-vision", "beauty-prediction", "transformer", "pytorch"]

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
    "albumentations>=1.3.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "numpy>=1.24,<2.0",
    "pillow>=9.0.0",
    "tqdm>=4.65.0",
    "pandas>=2.0.0,<2.3",
    "scikit-learn>=1.3.0,<1.6",
    "matplotlib>=3.7.0",
    "deepface>=0.0.90",
    "ml-dtypes>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.0.270",
    "mypy>=1.0.0",
    "pre-commit>=3.5.0",
    "isort>=5.12.0",
    "bandit>=1.7.0",
    "pydocstyle>=6.3.0",
    "commitizen>=3.12.0",
]
tensorboard = [
    "tensorboard>=2.13.0",
]
wandb = [
    "wandb>=0.15.0",
]
onnx = [
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
]
# all = [
#     "beauty-scorer[dev,tensorboard,wandb,onnx]",
# ]

[project.scripts]
beauty-train = "scripts.train:main"
beauty-evaluate = "scripts.evaluate:main"
beauty-infer = "scripts.infer:main"
beauty-export = "scripts.export_model:main"

[project.urls]
Homepage = "https://github.com/alessiosavi/BeautyScorer"
Documentation = "https://github.com/alessiosavi/BeautyScorer#readme"
Repository = "https://github.com/alessiosavi/BeautyScorer"
Issues = "https://github.com/alessiosavi/BeautyScorer/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["beauty_scorer*", "scripts*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

# =============================================================================
# isort configuration
# =============================================================================
[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["beauty_scorer"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

# =============================================================================
# Commitizen configuration
# =============================================================================
[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true
allowed_prefixes = ["Merge", "Revert", "hotfix", "release"]

# =============================================================================
# Bandit configuration
# =============================================================================
[tool.bandit]
exclude_dirs = ["tests", "scripts"]
skips = ["B101", "B311"]  # Skip assert and random warnings

# =============================================================================
# pydocstyle configuration
# =============================================================================
[tool.pydocstyle]
convention = "google"
add_ignore = ["D100", "D102", "D104", "D105", "D107", "D203", "D212", "D213"]
match = "(?!test_|debug_).*\\.py"
match_dir = "^(?!tests|scripts).*"
